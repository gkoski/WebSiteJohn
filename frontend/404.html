<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Mr. John Sports Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EBDCC1;
      --surface: #FBF4E2;
      --text: #1F1108;
      --text-dim: #5A4536;
      --text-muted: #8A7563;
      --red: #B5202A;
      --red-bright: #D6303C;
      --orange: #D17A2E;
      --orange-bright: #E48A36;
      --border: rgba(31,17,8,0.10);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid; place-items: center;
      padding: 40px 24px;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      top: -120px; right: -120px;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(181,32,42,0.22), transparent 65%);
    }
    body::after {
      bottom: -140px; left: -100px;
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(209,122,46,0.20), transparent 60%);
    }
    main {
      position: relative;
      z-index: 1;
      max-width: 580px;
    }
    .logo {
      font-family: 'Bagel Fat One', sans-serif;
      line-height: 1;
      margin-bottom: 36px;
      display: inline-flex; align-items: baseline; gap: 4px;
      text-decoration: none;
    }
    .logo .lmr { font-size: 22px; color: var(--red); }
    .logo .ljn {
      font-size: 34px;
      color: var(--red);
      position: relative;
    }
    .logo .ljn::after {
      content: '';
      position: absolute;
      bottom: -5px; left: 0; right: 0;
      height: 5px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 6' preserveAspectRatio='none'><path d='M2 4 Q20 1 40 3 T78 4' stroke='%23D17A2E' stroke-width='2.5' stroke-linecap='round' fill='none'/></svg>") center/100% 100% no-repeat;
    }
    .code {
      font-family: 'Bagel Fat One', sans-serif;
      font-size: clamp(96px, 22vw, 200px);
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--red);
      text-shadow: 0 8px 0 rgba(31,17,8,0.06);
      margin-bottom: 6px;
    }
    .code .zero {
      display: inline-block;
      color: var(--orange);
      transform: rotate(-6deg);
      position: relative;
    }
    .code .zero::before {
      content: '🍔';
      position: absolute;
      inset: 0;
      display: grid; place-items: center;
      font-size: 0.45em;
      transform: rotate(6deg);
    }
    h1 {
      font-family: 'Bagel Fat One', sans-serif;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 14px;
    }
    h1 .accent {
      color: var(--orange);
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 0.9em;
      display: inline-block;
      transform: rotate(-3deg);
    }
    p {
      max-width: 460px;
      margin: 0 auto 32px;
      color: var(--text-dim);
      font-size: 16px;
      line-height: 1.55;
    }
    .cta-row {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 26px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 14px;
      transition: transform .25s var(--ease), background .25s ease, border-color .25s;
      text-decoration: none;
    }
    .btn-primary { background: var(--red); color: #fff; box-shadow: 0 12px 28px -10px rgba(181,32,42,0.45); }
    .btn-primary:hover { background: var(--red-bright); transform: translateY(-2px); }
    .btn-ghost {
      color: var(--red);
      border: 1.5px solid var(--red);
      background: transparent;
    }
    .btn-ghost:hover { background: var(--red); color: #fff; transform: translateY(-2px); }
    .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .tip {
      margin-top: 32px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .tip a { color: var(--orange); text-decoration: none; font-weight: 600; }
    .tip a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <a href="/" class="logo"><span class="lmr">Mr.</span><span class="ljn">John</span></a>
    <div class="code">4<span class="zero">0</span>4</div>
    <h1>Essa página saiu do <span class="accent">cardápio</span></h1>
    <p>Parece que você procurou algo que não tá mais no menu da casa. Bora voltar pro telão principal — tem chopp gelado, smash burger e jogo rolando.</p>
    <div class="cta-row">
      <a href="/" class="btn btn-primary">
        <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        Voltar pra home
      </a>
      <a href="https://wa.me/5541997096628" target="_blank" rel="noopener" class="btn btn-ghost">
        Falar no WhatsApp
      </a>
    </div>
    <p class="tip">Ou veja o cardápio em <a href="/cardapio/cardapio.html">/cardapio</a>.</p>
  </main>
  <script src="footer.js"></script>
</body>
</html>
